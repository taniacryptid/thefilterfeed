<style>

  .tank-ctl button { font: inherit; font-size: clamp(12px, 1.2vw, 14px); line-height: 1; color: var(--ink); background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--shade); padding: 5px 10px 5px 6px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; text-shadow: none; }

<script>
const SPRITE = [
'......................FF......................',
'.....................FfDF.....................',
'....................FfDffF....................',
'...................FfDfDfF....................',
'..................FfDffDffF...................',
'.................FfDfDfffDF...................',
'FF..............SSfDffDfffSS..................',
'FfF......FF...SSLLHHHHHHLLLSSSS...............',
'FffF....FfF.SSLLLdddLLLdddLLHHHSS.............',
'FffDF..FfFSSSdLLLdddLLLLdddLLYYYySS...........',
'.FfDfSSttttdddtttdddtttdddtttYYYYYYSS.........',
'..FfDftttttdddtttDDDtttDDDttgggYYYggSS........',
'...FddddddtdddtttdddtttdddttGgggDgggheYSS.....',
'...FDDDDDDDtDDDtDDDDDtDDDDGggggDggeeeeggSS....',
'..FDfFttccccccccccccccctttGGgggDggeeeeggggSS..',
'.FfDtttcWWWWWWWWWWWWWWWWWWWWWWGGGGDGGGGggggYO.',
'FfDfOOOcwwwwwwwwwwwwwwwwwwwwwwwwwwwwGGGGGGOO..',
'FfDF..FFfOOOOwwwwwwwwwwwwwwwwwwwwwwwwwwwOObOb.',
'FDF...FfF...FffOOOOOwwwwwwwwOOOOOOffFOOO.b..b.',
'FF....FF....FfDF....OOOOOOOOOfDfF..FfDF.b.....',
'.............FF.............FffF...FffF.......',
'.............................FF.....FF........'];
const SW = SPRITE[0].length, SH = SPRITE.length;
// art follows Derek Yu's pixel art basics: one light source above, hue-shifted ramps, selective outlines, no translucency
const CMAP = {'.':0,'O':1,'S':2,'T':3,'t':4,'L':5,'H':6,'d':7,'D':8,'c':9,'C':10,'W':11,'w':12,'G':13,'g':14,'Y':15,'y':16,'F':17,'f':18,'e':19,'h':20,'b':21};

// cherry barb (Puntius titteya); one sprite, two palettes in the shader: crimson male, orange female with red fins
const BARB = [
'.................n................',
'.................fn...............',
'................Xfmn..............',
'................Xfmfn.............',
'...............FXfmfmn............',
'...nm.........SFFFFFfmn...........',
'...nfm.......SSHHHHHHHHSS.........',
'...nffm....SSLLLLLLHHHHHHHSS......',
'....nfmf..SRRRRLLgLLLLLLLLgLLLS...',
'.....nmfFSRRRRRRRRLLLLgLLLLLLheS..',
'.....nmfFXXXXXXXXXXXXXXXXXXXXeeXO.',
'....nfmfFOKKKKKKKKRRRRRnmffRRKKKO.',
'...nffm...OQQQQBBBBBBBBBBBBBBBQO..',
'...nfm.....OOQQQQQQQQQQQQQQQOOO...',
'...nm........OOFOOOOFOOOOOO.......',
'.............nfmF.nfmF............',
'...........nfmf..nfn..............',
'..........nn......................',
'..................................',
'..................................'];
const BW = BARB[0].length, BH = BARB.length;
// fins: F = dark base where the fin meets the body, f = ray, m = membrane, n = pale tips (as in photos of the species)
const BCMAP = {'.':0,'O':1,'S':2,'R':3,'L':4,'H':5,'K':6,'B':7,'Q':8,'X':9,'F':10,'f':11,'e':12,'h':13,'g':14,'m':15,'n':16};

// cherry shrimp (Neocaridina davidi); one sprite, four color morphs in the shader
const SHRIMP = [
'..............33333333333333............',
'............33..............33..........',
'...........3..................3.........',
'.................1111111111111.3........',
'..............11133344444443331.3...11..',
'...........1113334222222222233111111....',
'.........113342222122221222222233O......',
'.......113342122212222122222222heO......',
'......134222222222222222222222eeO333333.',
'.....1342221222122212222222222222O......',
'.....122OOOOOOOOOOOO11111111111O333.....',
'....1222O.3..3..3..OOOOOOOOOOO....333...',
'....122O..2..2..2..3.3..3.3..3..........',
'...1221O...........2..2..2..2...........',
'..132221O.........1...1..1..1...........',
'.132O.12O...............................',
'.OO....O................................'];
const RW = SHRIMP[0].length, RH = SHRIMP.length;
const RCMAP = {'.':0,'O':1,'2':2,'1':3,'4':4,'e':5,'h':6,'3':8};

// uniform layout, in vec4s: header (2), fish pairs, bubbles (48), food (24), fish angles (4 per vec4), lolly (2)
const MAX_FISH = 20;
const U_BUB = 2 + MAX_FISH * 2, U_FOOD = U_BUB + 48, U_ANG = U_FOOD + 24, U_LOLLY = U_ANG + MAX_FISH / 4, U_VEC4 = U_LOLLY + 2;

// all sprites packed into one storage buffer: corydoras first, then the barb, then the shrimp
function buildSprites() {
  const data = new Uint32Array(SW * SH + BW * BH + RW * RH);
  SPRITE.forEach((row, y) => [...row].forEach((ch, x) => data[y * SW + x] = CMAP[ch] || 0));
  BARB.forEach((row, y) => [...row].forEach((ch, x) => data[SW * SH + y * BW + x] = BCMAP[ch] || 0));
  SHRIMP.forEach((row, y) => [...row].forEach((ch, x) => data[SW * SH + BW * BH + y * RW + x] = RCMAP[ch] || 0));
  return data;
}

const WGSL = /* wgsl */`
struct Scene {
  a: vec4f,   // time, scale, vw, vh
  b: vec4f,   // nFish, nBub, nFood, groundTop
  fish: array<vec4f, ${MAX_FISH * 2}>,  // pairs: (x, y, dir, depth), (phase, amp, floorY, species)
  bub: array<vec4f, 48>,   // (x, y, r, depth)
  food: array<vec4f, 24>,  // (x, y, depth, 0)
  ang: array<vec4f, ${MAX_FISH / 4}>,  // per-fish rotation, packed four to a vec4
  l0: vec4f,  // lolly ball: x, y, radius, depth
  l1: vec4f,  // lolly stick base: x, y, active, bite roughness
};
@group(0) @binding(0) var<uniform> S: Scene;
@group(0) @binding(1) var<storage, read> sprite: array<u32>;

const SW: i32 = ${SW};
const SH: i32 = ${SH};
const BW: i32 = ${BW};
const BH: i32 = ${BH};
const BOFF: i32 = ${SW * SH};
const RW: i32 = ${RW};
const RH: i32 = ${RH};
const ROFF: i32 = ${SW * SH + BW * BH};

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  return vec4f(p[i], 0.0, 1.0);
}

fn hash(p: vec2f) -> f32 {
  let q = fract(p * vec2f(0.1031, 0.1030));
  let r = q + dot(q, q.yx + 33.33);
  return fract((r.x + r.y) * r.x);
}

// quantise a tint amount to fixed 0.15 steps, dithered between neighbours
fn qtint(x: f32, d: f32) -> f32 { return floor(x / 0.15 + d) * 0.15; }

fn bayer(p: vec2i) -> f32 {
  var m = array<f32, 16>(0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
  return (m[(p.y & 3) * 4 + (p.x & 3)] + 0.5) / 16.0;
}

fn hex(c: u32) -> vec3f {
  return vec3f(f32((c >> 16u) & 255u), f32((c >> 8u) & 255u), f32(c & 255u)) / 255.0;
}

fn groundAt(x: f32, top: f32) -> f32 {
  return top + round(sin(x * 0.045) * 2.0 + sin(x * 0.13 + 1.0) * 1.0);
}

// corydoras: outline, selout brown, tan ramp, band ramp, cream/belly, gold head ramp, fins, eye, barbels
fn fishPal(i: u32) -> vec3f {
  var pal = array<u32, 22>(0x000000u, 0x1e140eu, 0x4a3222u, 0x7a5634u, 0xb88a54u, 0xd9b47au, 0xf2dca8u,
                           0x4a3424u, 0x2a1c14u, 0xe6cf98u, 0xf6e6bcu, 0xf2ead2u, 0xd8c8a0u, 0x9a5a20u,
                           0xd08a38u, 0xf0b458u, 0xffe09au, 0x5e4a36u, 0xae9672u, 0x0f0a08u, 0xffffffu, 0x8a6a48u);
  return hex(pal[i]);
}

// species 1 = male cherry barb (crimson), 2 = female (orange, red fins)
fn barbPal(i: u32, female: bool) -> vec3f {
  // outline, selout, mid, light, highlight, shadow, belly, belly shade, stripe, fin base, fin ray, eye, eye shine, scale glint, membrane, fin tip
  // males: deep crimson, shadows leaning toward wine, highlights toward warm coral
  var m = array<u32, 17>(0x000000u, 0x24040eu, 0x6a0a1eu, 0xc0102cu, 0xe3243au, 0xff7a6au, 0x80081eu, 0xd8303fu,
                         0xa00e26u, 0x3a0410u, 0x8a0a20u, 0xe0303au, 0x0f0a08u, 0xffffffu, 0xffb0a0u, 0xe07a7cu, 0xf5b0a8u);
  // females: mostly orange, with red in the fins and shadows leaning red
  var f = array<u32, 17>(0x000000u, 0x2a0a08u, 0x6e1a12u, 0xe0602au, 0xf27c38u, 0xffb070u, 0xa83018u, 0xf48a52u,
                         0xc8482au, 0x420e0au, 0x9a1a18u, 0xe8442cu, 0x0f0a08u, 0xffffffu, 0xffd0a0u, 0xf09070u, 0xffc49au);
  return hex(select(m[i], f[i], female));
}

// species 3..6 = shrimp morphs: cherry red, orange sakura, blue dream, yellow
fn shrimpPal(i: u32, v: i32) -> vec3f {
  // ramps per morph: outline, mid, shadow, highlight, eye, eye shine, (unused), light; shadows lean cool, lights warm
  var red = array<u32, 9>(0u, 0x3b0f1au, 0xc42a2au, 0x7a1626u, 0xffb08au, 0x1a0a10u, 0xffffffu, 0u, 0xe8553au);
  var ora = array<u32, 9>(0u, 0x3d1a10u, 0xe0701cu, 0x9a3c14u, 0xffd49au, 0x1a0a10u, 0xffffffu, 0u, 0xf59a3cu);
  var blu = array<u32, 9>(0u, 0x101436u, 0x2f5ccau, 0x1f2a7au, 0xa8dcffu, 0x0a0a18u, 0xffffffu, 0u, 0x4f8ef0u);
  var yel = array<u32, 9>(0u, 0x3a2a10u, 0xdcb42cu, 0x8e6a1cu, 0xfff4b0u, 0x1a1408u, 0xffffffu, 0u, 0xf2d85au);
  if (v == 1) { return hex(ora[i]); }
  if (v == 2) { return hex(blu[i]); }
  if (v == 3) { return hex(yel[i]); }
  return hex(red[i]);
}

// the shrimp lolly: a wooden stick with a ball of food that gets nibbled down
fn lollySample(pf: vec2f, deepc: vec3f) -> vec4f {
  let L0 = S.l0;
  let L1 = S.l1;
  if (L1.z < 0.5) { return vec4f(0.0); }
  let ball = vec2f(L0.x, L0.y);
  let base = vec2f(L1.x, L1.y);
  var result = vec4f(0.0);
  let pc = pf + 0.5;
  if (pc.y <= base.y + 0.5) {
    let ba = ball - base;
    let pa = pc - base;
    let hh = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    let off = pa - ba * hh;
    if (length(off) < 1.3) {
      let side = ba.x * pa.y - ba.y * pa.x;
      var wood = select(hex(0xc89458u), hex(0x7a5230u), side > 0.0);
      if (fract(hh * 9.0) < 0.12) { wood = wood * 0.9; }
      result = vec4f(wood, 1.0);
    }
  }
  let r = L0.z;
  if (r > 0.5) {
    let qv = pc - ball;
    let ang = atan2(qv.y, qv.x);
    let bite = (hash(vec2f(floor((ang + 3.1416) * 3.0), 5.0)) - 0.5) * 2.4 * L1.w;
    let rr = r + bite;
    let dist = length(qv);
    if (dist < rr) {
      let hs = hash(floor(pf) + 9.0);
      var c = hex(0x7d6a2cu);
      if (hs > 0.78) { c = hex(0xa8923cu); }
      else if (hs < 0.16) { c = hex(0x4c5a22u); }
      else if (hs < 0.22) { c = hex(0xb0502au); }
      if (qv.x < -r * 0.2 && qv.y < -r * 0.2 && dist < r * 0.75) { c = mix(c, hex(0xe8d898u), 0.35); }
      if (dist > rr - 1.0) { c = hex(0x3c3012u); }
      else if (qv.y > r * 0.35) { c = c * 0.82; }
      result = vec4f(c, 1.0);
    }
  }
  if (result.a > 0.0) { result = vec4f(mix(result.rgb, deepc, qtint(L0.w * 0.45, bayer(vec2i(pf)))), 1.0); }
  return result;
}

// Vallisneria-style ribbon grass, drawn to the same pixel-art rules as the sprites:
// - each blade's centre line is a parabola (x = tip * s^2), so its horizontal steps shrink evenly
//   toward the tip instead of wobbling into jaggies
// - the sway is posed in held frames (4 per second) like hand-animated pixel art, not a smooth wave
// - light from above: the side facing up is lit, the far side is in shade, tips catch a highlight,
//   and the base darkens where the clump shades itself (dithered)
// - fixed ramps per depth layer instead of blending with the water; only the foreground clumps get
//   an outline, and only on their shadow side (selective outlining)
fn plantRamp(layer: i32, tone: i32) -> vec3f {
  var near = array<u32, 5>(0x10261au, 0x24502cu, 0x356c34u, 0x4f8c42u, 0x7ab25cu);
  var mid = array<u32, 5>(0x1a3d35u, 0x2a5b42u, 0x377148u, 0x4e8a53u, 0x6fa569u);
  var far = array<u32, 5>(0x1e4644u, 0x285b4du, 0x326b51u, 0x427d59u, 0x5a9069u);
  if (layer == 0) { return hex(near[tone]); }
  if (layer == 1) { return hex(mid[tone]); }
  return hex(far[tone]);
}

fn clump(pf: vec2f, i: f32, vw: f32, vh: f32, top: f32, t: f32, front: bool, d: f32) -> vec4f {
  var baseX: f32;
  var hmul: f32;
  if (front) { baseX = select(vw - 10.0, 6.0, i < 0.5); hmul = 1.25; }
  else { baseX = floor(fract(i * 0.618034 + 0.17) * vw); hmul = 1.0; }
  let gb = groundAt(baseX, top) + select(0.0, vh - top - 3.0, front);
  let layer = select(select(2, 1, (i32(i) & 1) == 1), 0, front);
  let pose = floor(t * 4.0);
  let up = gb - pf.y;
  for (var j = 0; j < 5; j++) {
    let fj = f32(j);
    let hseed = hash(vec2f(i * 7.0 + fj, 3.0 + select(0.0, 9.0, front)));
    let h = (vh * 0.2 + hseed * vh * 0.32) * hmul;
    if (up < 0.0 || up > h) { continue; }
    let s = up / h;
    // whole-pixel tip offset: the blade fans out from the clump and leans a little with each pose
    let sway = sin(pose * 0.55 + i * 1.7 + fj * 0.9);
    let tip = round((fj - 2.0) * 6.0 + (hseed - 0.5) * 6.0 + sway * 3.0);
    let cx = baseX + fj * 2.0 - 4.0 + round(tip * s * s);
    let w = select(select(1.0, 2.0, s < 0.72), 3.0, s < 0.3);
    let dx = pf.x - cx;
    if (dx < 0.0 || dx >= w) { continue; }
    let litLeft = tip >= 0.0;
    let onLit = (litLeft && dx == 0.0) || (!litLeft && dx == w - 1.0);
    let onShade = w > 1.0 && ((litLeft && dx == w - 1.0) || (!litLeft && dx == 0.0));
    var tone = 2;
    if (w == 1.0 || onLit) { tone = 3; }
    if (onShade) { tone = 1; }
    if (s > 0.86 && !onShade) { tone = 4; }
    if (s < 0.18 + d * 0.14) { tone = max(tone - 1, 0); }
    if (front && onShade) { tone = 0; }
    return vec4f(plantRamp(layer, tone), 1.0);
  }
  return vec4f(0.0);
}

fn barbSample(p: vec2i, f0: vec4f, f1: vec4f, t: f32) -> vec4f {
  var lx = p.x - i32(f0.x);
  var ly = p.y - i32(f0.y);
  if (lx < 0 || lx >= BW || ly < -2 || ly >= BH + 2) { return vec4f(0.0); }
  if (f0.z < 0.0) { lx = BW - 1 - lx; }
  if (lx < 13) {
    let k = f32(13 - lx) / 13.0;
    ly = ly - i32(round(sin(f1.x - f32(lx) * 0.5) * f1.y * k * k * 1.8));
  }
  // pelvic and anal fin flutter
  if (ly >= 15 && lx >= 12 && lx <= 28) {
    ly = ly - i32(round(sin(f1.x * 0.8 + 0.5) * 0.6));
  }
  if (ly < 0 || ly >= BH) { return vec4f(0.0); }
  let idx = sprite[u32(BOFF + ly * BW + lx)];
  if (idx == 0u) { return vec4f(0.0); }
  let female = f1.w > 1.5;
  var c = barbPal(idx, female);
  // scale glints catch the light as the fish swims
  if (idx == 14u && sin(t * 2.0 + f0.x * 0.3 + f32(lx) * 0.4) < -0.2) { c = barbPal(4u, female); }
  return vec4f(c, 1.0);
}

fn shrimpSample(p: vec2i, f0: vec4f, f1: vec4f, ang: f32, t: f32) -> vec4f {
  // rotate about the sprite centre with nearest sampling so it stays pixel-crisp (climbing the lolly)
  let ctr = vec2f(f32(RW) * 0.5, f32(RH) * 0.5);
  let q = vec2f(p) + 0.5 - (vec2f(f0.x, f0.y) + ctr);
  if (dot(q, q) > 520.0) { return vec4f(0.0); }
  let ca = cos(ang);
  let sa = sin(ang);
  let rl = floor(vec2f(q.x * ca + q.y * sa, -q.x * sa + q.y * ca) + ctr);
  var lx = i32(rl.x);
  var ly = i32(rl.y);
  if (lx < 0 || lx >= RW || ly < -2 || ly >= RH + 2) { return vec4f(0.0); }
  if (f0.z < 0.0) { lx = RW - 1 - lx; }
  // tail fan flicks
  if (lx < 9) {
    let k = f32(9 - lx) / 9.0;
    ly = ly - i32(round(sin(f1.x * 0.5) * f1.y * k * 2.0));
  }
  // antennae sway
  if (ly <= 3 || (ly >= 8 && lx >= 33)) {
    ly = ly + i32(round(sin(t * 1.7 + f0.x * 0.1 + f32(lx) * 0.15) * 0.7));
  }
  if (ly < 0 || ly >= RH) { return vec4f(0.0); }
  var idx = sprite[u32(ROFF + ly * RW + lx)];
  // walking legs and swimmerets paddle in alternating waves
  if (ly >= 12 && lx >= 9 && lx <= 32) {
    let step = select(1, -1, sin(f1.x + f32(lx) * 0.9) > 0.0);
    let sx = clamp(lx + step * select(0, 1, ly >= 13), 9, RW - 1);
    idx = sprite[u32(ROFF + ly * RW + sx)];
  }
  if (idx == 0u) { return vec4f(0.0); }
  return vec4f(shrimpPal(idx, i32(round(f1.w)) - 3), 1.0);
}

fn fishSample(p: vec2i, f0: vec4f, f1: vec4f, ang: f32, t: f32) -> vec4f {
  if (f1.w > 2.5) { return shrimpSample(p, f0, f1, ang, t); }
  if (f1.w > 0.5) { return barbSample(p, f0, f1, t); }
  let fx = i32(f0.x);
  let fy = i32(f0.y);
  var lx = p.x - fx;
  var ly = p.y - fy;
  if (lx < 0 || lx >= SW || ly < -3 || ly >= SH + 3) { return vec4f(0.0); }
  if (f0.z < 0.0) { lx = SW - 1 - lx; }
  if (lx < 15) {
    let k = f32(15 - lx) / 15.0;
    ly = ly - i32(round(sin(f1.x - f32(lx) * 0.38) * f1.y * k * k * 2.2));
  }
  // pectoral and pelvic fin flutter
  if (ly >= 17 && lx >= 12 && lx <= 16) {
    ly = ly - i32(round(sin(f1.x * 0.7 + 1.0) * 0.6));
  }
  if (ly < 0 || ly >= SH) { return vec4f(0.0); }
  let idx = sprite[u32(ly * SW + lx)];
  if (idx == 0u) { return vec4f(0.0); }
  var c = fishPal(idx);
  var a = 1.0;
  // barbels twitch
  if (idx == 21u && sin(t * 3.0 + f0.x) > 0.6) { return vec4f(0.0); }
  return vec4f(c, a);
}

@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let t = S.a.x;
  let sc = S.a.y;
  let vw = S.a.z;
  let vh = S.a.w;
  let top = S.b.w;
  let p = vec2i(floor(fc.xy / sc));
  let pf = vec2f(p);
  let d = bayer(p);
  let g = groundAt(pf.x, top);

  // water: dithered bands, lighter toward the surface
  var wat = array<u32, 5>(0x7cc2b0u, 0x4f9e96u, 0x357c7fu, 0x255c68u, 0x1b4352u);
  let wy = clamp(pf.y / (top + 6.0), 0.0, 1.0);
  let lv = wy * 4.0;
  var wi = i32(floor(lv)) + select(0, 1, fract(lv) > d);
  let ray = sin((pf.x + pf.y * 0.55) * 0.06 + t * 0.25) * sin((pf.x + pf.y * 0.55) * 0.021 - t * 0.11);
  if (smoothstep(0.3, 0.85, ray) * (1.15 - wy) > d) { wi -= 1; }
  wi = clamp(wi, 0, 4);
  var col = hex(wat[wi]);
  let deep = hex(0x255c68u);

  let sy = 1.0 + round(sin(pf.x * 0.18 + t * 1.5) * 0.8 + sin(pf.x * 0.07 - t) * 0.6);
  if (pf.y < sy) { col = hex(0xa8dccbu); }
  else if (pf.y == sy) { col = hex(0xdaf3e6u); }

  // drifting specks
  let qp = pf + vec2f(t * 1.3, -t * 0.7);
  let cell = floor(qp / 14.0);
  let loc = floor(qp - cell * 14.0);
  let tgt = floor(vec2f(hash(cell), hash(cell + 17.0)) * 14.0);
  if (all(loc == tgt) && hash(cell + 3.0) > 0.55 && pf.y < g) { col = mix(col, hex(0xd8eadcu), 0.55); }

  // back plants
  let nBack = clamp(i32(vw / 38.0), 3, 14);
  for (var i = 0; i < nBack; i++) {
    let c = clump(pf, f32(i), vw, vh, top, t, false, d);
    if (c.a > 0.0) { col = c.rgb; break; }
  }

  // sand floor, seen at an angle: farther rows lighter, nearer rows bigger pebbles
  if (pf.y >= g) {
    let sd = pf.y - g;
    let fz = sd / max(vh - top, 1.0);
    let hs = hash(pf);
    var sand = hex(0xb89d68u);
    if (sd < 1.0) { sand = hex(0xd9c48eu); }
    else if (hs > 0.86) { sand = hex(0x8f7748u); }
    else if (hs < 0.07) { sand = hex(0xe0cf9cu); }
    if (fz > 0.55 + d * 0.3) { sand = sand * 0.88; }
    let ps = vec2f(7.0 + fz * 5.0, 5.0 + fz * 4.0);
    let pc = floor(pf / ps);
    let hp = hash(pc + 41.0);
    if (hp > 0.7 && sd > 1.0) {
      let ctr = pc * ps + ps * 0.5;
      let r = (pf - ctr) / (ps * vec2f(0.36, 0.34));
      let e = dot(r, r);
      if (e < 1.0) {
        var pcols = array<u32, 4>(0x8a8478u, 0x6e5a44u, 0x9a6a46u, 0xb0aa98u);
        sand = hex(pcols[u32(hp * 13.0) % 4u]);
        if (r.y < -0.4 && r.x < 0.2) { sand = mix(sand, vec3f(1.0), 0.35); }
        else if (r.y > 0.45) { sand = sand * 0.75; }
      }
    }
    let cv = sin(pf.x * 0.33 + t * 1.1 + sin(pf.y * 0.6 + t)) + sin(pf.y * 0.9 - t * 0.8 + pf.x * 0.12);
    if (cv > 1.3 + fz * 0.4) { sand = mix(sand, hex(0xf0e3b6u), 0.35); }
    col = mix(sand, deep, qtint((1.0 - fz) * 0.18, d));

    // fish shadows
    let nF = i32(S.b.x);
    for (var i = 0; i < nF; i++) {
      let f0 = S.fish[i * 2];
      let f1 = S.fish[i * 2 + 1];
      let barb = f1.w > 0.5 && f1.w < 2.5;
      let shrimp = f1.w > 2.5;
      let cx = f0.x + select(select(f32(SW), f32(BW), barb), f32(RW), shrimp) * 0.5;
      let lift = clamp((f1.z - (f0.y + select(select(f32(SH), f32(BH), barb), f32(RH), shrimp))) / 50.0, 0.0, 1.0);
      let hw = (select(select(15.0, 9.0, barb), 12.0, shrimp) - f0.w * 4.0) * (1.0 - lift * 0.4);
      let dy = pf.y - f1.z;
      if (abs(pf.x - cx) < hw && dy >= -1.0 && dy <= 1.0 && d < 0.75 - lift * 0.6) { col = col * 0.78; }
    }
  }

  // food pellets
  let nFood = i32(S.b.z);
  for (var i = 0; i < nFood; i++) {
    let fd = S.food[i];
    let o = pf - vec2f(round(fd.x), round(fd.y));
    if (o.x >= 0.0 && o.x <= 1.0 && o.y >= 0.0 && o.y <= 1.0) {
      var fc2 = select(hex(0x7a3c18u), hex(0xc8642au), o.x == 0.0 && o.y == 0.0);
      col = mix(fc2, deep, qtint(fd.z * 0.45, d));
    }
  }

  // fish, already sorted back to front, with the shrimp lolly slotted in at its depth
  let nF = i32(S.b.x);
  var lollyDone = false;
  for (var i = 0; i < nF; i++) {
    let f0 = S.fish[i * 2];
    let f1 = S.fish[i * 2 + 1];
    if (!lollyDone && f0.w <= S.l0.w) {
      lollyDone = true;
      let lc = lollySample(pf, deep);
      if (lc.a > 0.0) { col = lc.rgb; }
    }
    let s = fishSample(p, f0, f1, S.ang[i / 4][i % 4], t);
    if (s.a > 0.0) {
      let fcl = mix(s.rgb, deep, qtint(f0.w * 0.5, d));
      col = mix(col, fcl, s.a);
    }
  }
  if (!lollyDone) {
    let lc = lollySample(pf, deep);
    if (lc.a > 0.0) { col = lc.rgb; }
  }

  // front plants
  for (var i = 0; i < 2; i++) {
    let c = clump(pf, f32(i), vw, vh, top, t * 0.8, true, d);
    if (c.a > 0.0) { col = c.rgb; break; }
  }

  // bubbles
  let nB = i32(S.b.y);
  for (var i = 0; i < nB; i++) {
    let b = S.bub[i];
    let c = vec2f(round(b.x), round(b.y));
    let o = pf - c;
    let dist = length(o);
    if (b.z < 1.5) {
      if (all(o == vec2f(0.0))) { col = mix(col, hex(0xe6f6eeu), 0.85); }
    } else if (dist > b.z - 0.7 && dist < b.z + 0.35) {
      col = mix(col, hex(0xe6f6eeu), 0.8);
    } else if (dist < b.z && o.x == -1.0 && o.y == -1.0) {
      col = hex(0xffffffu);
    }
  }

  // stepped vignette
  let uv = pf / vec2f(vw, vh) - 0.5;
  let v = dot(uv, uv) * 1.4;
  if (v > 0.28 + d * 0.12) { col = col * 0.86; }

  return vec4f(col, 1.0);
}
`;

const canvas = document.getElementById('c');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fail(msg) {
  document.getElementById('nogpu').style.display = 'grid';
  document.getElementById('lolly').hidden = true;
  document.querySelector('.caption').style.display = 'none';
  if (msg) document.getElementById('why').insertAdjacentText('beforeend', ' ' + msg);
}

async function main() {
  if (!navigator.gpu) return fail();
  let adapter;
  try { adapter = await navigator.gpu.requestAdapter(); } catch (e) {}
  if (!adapter) return fail('No compatible GPU adapter was found.');
  const device = await adapter.requestDevice();
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });

  const module = device.createShaderModule({ code: WGSL });
  module.getCompilationInfo?.().then(info => {
    for (const m of info.messages) if (m.type === 'error') console.error('WGSL', m.lineNum, m.message);
  });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
  });

  const spriteData = buildSprites();
  const spriteBuf = device.createBuffer({ size: spriteData.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(spriteBuf, 0, spriteData);

  const uData = new Float32Array(U_VEC4 * 4);
  const uBuf = device.createBuffer({ size: uData.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bind = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: uBuf } }, { binding: 1, resource: { buffer: spriteBuf } }],
  });

  // ---- virtual pixel space ----
  let scale = 4, vw = 320, vh = 160, top = 120;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.max(1, Math.min(8192, Math.floor(innerWidth * dpr)));
    const H = Math.max(1, Math.min(8192, Math.floor(innerHeight * dpr)));
    canvas.width = W; canvas.height = H;
    scale = Math.max(2, Math.floor(H / 150));
    vw = Math.ceil(W / scale); vh = Math.ceil(H / scale);
    top = Math.round(vh - Math.max(34, vh * 0.26));
  }
  resize();
  addEventListener('resize', resize);

  const groundAt = x => top + Math.round(Math.sin(x * 0.045) * 2 + Math.sin(x * 0.13 + 1) * 1);
  const floorY = z => (vh - 4) - z * (vh - 4 - top - 6);
  const rand = (a, b) => a + Math.random() * (b - a);

  const approach = (v, to, max) => v + Math.sign(to - v) * Math.min(Math.abs(to - v), max);

  // ---- shrimp lolly ----
  // a wooden stick with a ball of food that sinks to the sand; shrimp climb it and nibble it down
  const LOLLY_R = 14, LOLLY_LEN = 46;
  // spots around the ball, as angles away from the stick's "up"; the stick end is left free
  const SLOTS = [0, -1.0, 1.0, -2.0, 2.0, -2.7, 2.7];
  let lolly = null;
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  const centerOf = f => [f.x + RW / 2, floorY(f.z) - RH + 3 - f.h + RH / 2];
  function setCenter(f, cx, cy) { f.x = cx - RW / 2; f.h = floorY(f.z) - RH + 3 + RH / 2 - cy; }

  function letGo(f) {
    if (lolly && f.slot != null) lolly.slots[f.slot] = null;
    f.lolly = null; f.slot = null;
    f.mode = 'graze'; f.timer = rand(1, 2.5); f.th = 0; f.tx = f.x; f.tz = f.z = Math.max(0, f.z);
  }

  const lollyBtn = document.getElementById('lolly');
  function dropLolly() {
    for (const f of fish) if (f.lolly) letGo(f);
    const z = rand(0.05, 0.35);
    const baseX = Math.round(rand(vw * 0.3, vw * 0.7));
    lolly = { baseX, baseY: -LOLLY_LEN - LOLLY_R - 4, restY: floorY(z) - 1, z, r: LOLLY_R,
              tilt: 0, wob: rand(0, 6), landed: false, gone: 0, bx: 0, by: 0,
              slots: SLOTS.map(() => null) };
    lollyBtn.textContent = 'Drop a fresh lolly';
  }
  lollyBtn.addEventListener('click', dropLolly);

  function updateLolly(dt) {
    const L = lolly;
    if (!L) return;
    if (!L.landed) {
      L.baseY += 18 * dt; L.wob += dt * 2.2;
      L.tilt = Math.sin(L.wob) * 0.18;
      if (L.baseY >= L.restY) { L.baseY = L.restY; L.landed = true; L.tilt = Math.round(L.tilt * 10) / 10; }
    }
    L.bx = L.baseX + Math.sin(L.tilt) * LOLLY_LEN;
    L.by = L.baseY - Math.cos(L.tilt) * LOLLY_LEN;
    const eaters = fish.filter(f => f.lolly === 'eat').length;
    if (L.r > 0) L.r = Math.max(0, L.r - dt * 0.025 * eaters);
    if (L.r < 2 && L.r > 0) { L.r = 0; for (const f of fish) if (f.lolly && f.lolly !== 'toLolly') letGo(f); }
    if (L.r === 0) {
      for (const f of fish) if (f.lolly) letGo(f);
      L.gone += dt;
      if (L.gone > 8) { lolly = null; lollyBtn.textContent = 'Drop a shrimp lolly'; }
    }
  }

  // returns true when the lolly is driving this shrimp's movement for the frame
  function lollyStep(f, dt) {
    const L = lolly;
    if (f.lolly && food.length) { letGo(f); return false; }
    if (!f.lolly) {
      const free = L && L.landed && L.r >= 2 && L.slots.includes(null) && !food.length;
      if (free && f.mode !== 'swim' && Math.random() < dt * 0.6) {
        f.lolly = 'toLolly';
        f.side = f.x + RW / 2 < L.baseX ? -1 : 1;
      } else return false;
    }
    if (!L || L.r < 2) { letGo(f); return false; }

    const u = [L.bx - L.baseX, L.by - L.baseY];
    const len = Math.hypot(u[0], u[1]); u[0] /= len; u[1] /= len;
    const up = Math.atan2(u[1], u[0]);

    if (f.lolly === 'toLolly') {
      // walk over to the foot of the stick, at the lolly's depth
      f.mode = 'lolly'; f.speed = 18; f.th = 0;
      f.tx = L.baseX + f.side * 10 - RW / 2; f.tz = L.z;
      if (Math.abs(f.tx - f.x) < 1.5 && Math.abs(f.z - L.z) < 0.02 && f.h < 0.5) {
        f.lolly = 'climb'; f.s = 16; f.dir = f.side < 0 ? 1 : -1; f.z = L.z - 0.01;
      }
      return false;
    }

    let tx, ty, ta, speed;
    if (f.lolly === 'climb') {
      // legs on the stick, head up, inching toward the ball
      f.s += 7 * dt;
      ta = up + (f.dir < 0 ? Math.PI : 0);
      const D = [-Math.sin(ta), Math.cos(ta)];
      tx = L.baseX + u[0] * f.s - D[0] * 6; ty = L.baseY + u[1] * f.s - D[1] * 6;
      speed = 14;
      if (f.s >= len - L.r - 2) {
        const k = L.slots.indexOf(null);
        if (k < 0) { letGo(f); return false; }
        L.slots[k] = f; f.slot = k; f.lolly = 'toSlot';
      }
    } else {
      // perched on the ball, clinging diagonally with legs gripping and head tipped in to graze
      const th = up + SLOTS[f.slot];
      ta = th + Math.PI / 2 + f.dir * Math.PI / 4;
      tx = L.bx + Math.cos(th) * (L.r + 8); ty = L.by + Math.sin(th) * (L.r + 8);
      speed = f.lolly === 'toSlot' ? 9 : 4;
    }
    const [cx, cy] = centerOf(f);
    const ddx = tx - cx, ddy = ty - cy, dd = Math.hypot(ddx, ddy);
    const st = Math.min(dd, speed * dt);
    if (dd > 0.01) setCenter(f, cx + ddx / dd * st, cy + ddy / dd * st);
    if (f.lolly === 'toSlot' && dd < 1) f.lolly = 'eat';
    f.ang = (f.ang || 0) + wrap(ta - (f.ang || 0)) * Math.min(1, dt * 5);
    f.amp += (0 - f.amp) * Math.min(1, dt * 4);
    f.phase += dt * (f.lolly === 'eat' ? 6 : 10);
    f.tx = f.x; f.tz = f.z;
    return true;
  }

  // ---- fish ----
  // which species are in the tank; remembered between visits (iframe and fullscreen share it)
  const SPECIES = {
    cory: { w: SW, count: () => Math.min(7, 3 + Math.floor(vw / 160)) },
    barb: { w: BW, count: () => Math.min(7, 4 + Math.floor(vw / 180)) },
    shrimp: { w: RW, count: () => Math.min(6, 3 + Math.floor(vw / 200)) },
  };
  const STORE = 'filterfeed:tank';
  const enabled = { cory: true, barb: true, shrimp: true };
  try { Object.assign(enabled, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}

  let fish = [];
  function makeFish(species, entering) {
    const w = SPECIES[species].w;
    const side = Math.random() < 0.5 ? -1 : 1;
    const f = {
      species, x: entering ? (side < 0 ? -w - 2 : vw + 2) : rand(0, vw - w), z: rand(0.15, 0.9), h: 0,
      tx: 0, tz: 0, th: 0, dir: entering ? -side : (Math.random() < 0.5 ? 1 : -1),
      phase: rand(0, 6), amp: 0.4, speed: 10, mode: 'rest', timer: rand(0.5, 3), bubbleCd: 0, leaving: false,
    };
    f.tx = entering ? rand(0, vw - w) : f.x; f.tz = f.z;
    if (species === 'cory') { if (entering) { f.mode = 'wander'; f.speed = rand(14, 20); } }
    else if (species === 'shrimp') {
      // mostly cherry red, with the odd sakura, blue dream or yellow
      f.variant = Math.random() < 0.5 ? 0 : Math.floor(Math.random() * 4);
      f.amp = 0; f.speed = 6; f.flick = 0;
      f.mode = entering ? 'walk' : 'graze';
      if (entering) f.speed = rand(8, 12);
    } else {
      f.female = Math.random() < 0.5;
      f.y = rand(12, top - BH - 14); f.ty = f.y;
      f.ox = 0; f.oy = 0; f.oz = 0; f.timer = 0; f.mode = 'school';
    }
    return f;
  }
  function setSpecies(species, on, entering) {
    enabled[species] = on;
    try { localStorage.setItem(STORE, JSON.stringify(enabled)); } catch (e) {}
    const btn = document.querySelector(`[data-species="${species}"]`);
    if (btn) btn.setAttribute('aria-pressed', String(on));
    if (species === 'shrimp') lollyBtn.hidden = !on;
    const mine = fish.filter(f => f.species === species);
    if (on) {
      // call back any that were on their way out, then top up the group
      for (const f of mine) if (f.leaving) { f.leaving = false; f.mode = { cory: 'rest', barb: 'school', shrimp: 'graze' }[f.species]; f.timer = 0; }
      for (let i = mine.length; i < SPECIES[species].count() && fish.length < MAX_FISH; i++) fish.push(makeFish(species, entering));
    } else {
      // swim out past the nearest edge rather than vanishing
      for (const f of mine) {
        const w = SPECIES[species].w;
        f.leaving = true;
        f.exitX = f.x + w / 2 < vw / 2 ? -w - 4 : vw + 4;
      }
    }
  }
  for (const k in SPECIES) setSpecies(k, enabled[k], false);
  fish.forEach((f, i) => { if (i === 0 && f.species === 'cory') f.z = f.tz = 0; });
  document.querySelectorAll('[data-species]').forEach(btn => btn.addEventListener('click', () => {
    setSpecies(btn.dataset.species, !enabled[btn.dataset.species], true);
  }));

  // the barbs hang around a shared point that drifts through the mid-water
  const school = { x: vw / 2, y: top * 0.45, z: 0.45, tx: vw / 2, ty: top * 0.45, tz: 0.45, timer: 0 };
  function updateSchool(dt) {
    school.timer -= dt;
    if (school.timer <= 0) {
      school.timer = rand(3, 7);
      school.tx = rand(BW, Math.max(BW + 1, vw - BW * 2));
      school.ty = rand(16, Math.max(17, top - BH - 20));
      school.tz = rand(0.15, 0.8);
    }
    school.x = approach(school.x, school.tx, 16 * dt);
    school.y = approach(school.y, school.ty, 8 * dt);
    school.z = approach(school.z, school.tz, 0.08 * dt);
  }
  const bubbles = [];
  const food = [];

  function pickWander(f) {
    f.mode = 'wander';
    f.tx = rand(-8, vw - SW + 8);
    f.tz = Math.random() < 0.3 ? f.z : rand(0, 0.9);
    f.th = Math.random() < 0.15 ? rand(4, 14) : 0;
    f.speed = rand(7, 15);
  }

  function spawnBubble(x, y, z) {
    if (bubbles.length >= 48) return;
    bubbles.push({ x, y, z, r: Math.random() < 0.45 ? 2 : 1, vy: rand(9, 15), ph: rand(0, 6) });
  }

  canvas.addEventListener('pointerdown', e => {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * vw;
    const y = Math.min((e.clientY - r.top) / r.height * vh, top - 4);
    for (let k = 0; k < 4 && food.length < 24; k++) {
      const z = rand(0, 0.7);
      food.push({ x: x + rand(-6, 6), y: y + rand(-2, 2), z, rest: floorY(z) - 4 + rand(0, 2), landed: false });
    }
  });

  // cherry barbs: a loose mid-water school that snaps up pellets on the way down
  function updateBarb(f, dt) {
    // the rounded face ends one pixel in from the sprite edge
    const mouthX = f.x + (f.dir > 0 ? BW - 2 : 1), mouthY = f.y + 11;
    f.timer -= dt;
    if (f.leaving) {
      f.mode = 'leave'; f.tx = f.exitX; f.ty = f.y; f.speed = 34;
    } else if (food.some(p => !p.landed)) {
      // barbs feed mid-water: once a pellet reaches the sand it's left for the corys and shrimp
      let best = null, bd = 1e9;
      for (const p of food) {
        if (p.landed) continue;
        const dd = Math.abs(p.x - mouthX) + Math.abs(p.y - mouthY) + Math.abs(p.z - f.z) * 60;
        if (dd < bd) { bd = dd; best = p; }
      }
      f.mode = 'food';
      const want = best.x > f.x + BW / 2 ? 1 : -1;
      // each fish closes in from its own angle so the school doesn't collapse onto one spot
      const spread = Math.min(1, (Math.abs(best.x - mouthX) + Math.abs(best.y - mouthY)) / 24);
      f.tx = (want > 0 ? best.x - (BW - 2) : best.x - 1) + (f.ox || 0) * 0.3 * spread;
      f.ty = best.y - 11 + (f.oy || 0) * 0.3 * spread; f.tz = best.z; f.speed = 34;
      if (Math.abs(best.x - mouthX) < 2.5 && Math.abs(best.y - mouthY) < 2.5 && Math.abs(best.z - f.z) < 0.08) {
        food.splice(food.indexOf(best), 1);
        f.mode = 'school'; f.timer = rand(0.3, 1);
      }
    } else {
      f.mode = 'school';
      if (f.timer <= 0) {
        f.timer = rand(0.8, 2.5);
        f.ox = rand(-30, 30); f.oy = rand(-12, 12); f.oz = rand(-0.15, 0.15);
        f.speed = Math.random() < 0.15 ? 40 : rand(10, 22);
      }
      f.tx = school.x + f.ox; f.ty = school.y + f.oy; f.tz = Math.max(0, Math.min(0.9, school.z + f.oz));
    }
    f.ty = Math.max(6, Math.min(f.ty, floorY(f.z) - BH + 4));

    const dx = f.tx - f.x, dy = f.ty - f.y;
    // chasing a sinking pellet needs a tighter grip, or the fish trails it all the way down
    const gain = f.mode === 'food' ? 3 : 1;
    const vx = Math.sign(dx) * Math.min(Math.abs(dx) * 2.5 * gain, f.speed);
    const vy = Math.sign(dy) * Math.min(Math.abs(dy) * 2 * gain, f.speed * 0.6);
    f.x += vx * dt; f.y += vy * dt;
    if (Math.abs(dx) > 3) f.dir = dx > 0 ? 1 : -1;
    f.z = approach(f.z, f.tz, 0.25 * dt);

    const moving = Math.abs(vx) > 0.5 || Math.abs(vy) > 0.5;
    f.amp += ((moving ? 0.5 + Math.min(Math.abs(vx), 30) / 20 : 0.3) - f.amp) * Math.min(1, dt * 3);
    f.phase += dt * (moving ? 7 + Math.abs(vx) * 0.5 : 3.5);
  }

  // cherry shrimp: pick over the sand, take short swims, and nibble food slowly
  const MOUTH = 33, MOUTH_Y = 10;
  function pickWalk(f) {
    if (Math.random() < 0.25) {
      // short swim: lift off the sand and paddle somewhere
      f.mode = 'swim'; f.th = rand(8, 40); f.speed = rand(10, 18);
      f.tx = rand(-8, vw - RW + 8); f.tz = rand(0, 0.9);
    } else {
      f.mode = 'walk'; f.th = 0; f.speed = rand(3, 7);
      f.tx = Math.max(-8, Math.min(vw - RW + 8, f.x + rand(-60, 60)));
      f.tz = Math.max(0, Math.min(0.9, f.z + rand(-0.25, 0.25)));
    }
  }
  function updateShrimp(f, dt) {
    const baseY = floorY(f.z) - RH + 3;
    const mouthX = f.x + (f.dir > 0 ? MOUTH : RW - 1 - MOUTH);

    if (f.leaving) {
      if (f.lolly) letGo(f);
      f.mode = 'leave'; f.tx = f.exitX; f.th = 0; f.speed = 20; f.flick = 0;
    }

    // the escape flick: a quick backward dart, tail first
    if (f.flick > 0) {
      f.flick -= dt;
      f.x -= f.dir * 55 * dt;
      f.amp = 2.2; f.phase += dt * 30;
      f.x = Math.max(-RW / 2, Math.min(vw - RW / 2, f.x));
      f.tx = f.x;
      return;
    }

    if (!f.leaving && lollyStep(f, dt)) return;
    if (!f.lolly) f.ang = (f.ang || 0) * Math.max(0, 1 - dt * 4);

    if (food.length && !f.leaving && !f.lolly) {
      let best = null, bd = 1e9;
      for (const p of food) {
        const dd = Math.abs(p.x - mouthX) + Math.abs(p.z - f.z) * 60;
        if (dd < bd) { bd = dd; best = p; }
      }
      f.mode = 'food';
      const want = best.x > f.x + RW / 2 ? 1 : -1;
      f.tx = want > 0 ? best.x - MOUTH : best.x - (RW - 1 - MOUTH);
      f.tz = best.z;
      f.th = best.landed ? 0 : Math.max(0, baseY + MOUTH_Y - best.y);
      f.speed = 16;
      if (best.landed && Math.abs(best.x - mouthX) < 2.5 && Math.abs(best.z - f.z) < 0.06) {
        // shrimp pick at food for a while before it's gone
        best.bites = (best.bites || 0) + dt;
        if (best.bites > 1.6) food.splice(food.indexOf(best), 1);
      }
    } else if (f.mode === 'food') {
      f.mode = 'graze'; f.timer = rand(1, 3);
    }

    f.timer -= dt;
    if (f.mode === 'graze' && f.timer <= 0) {
      if (Math.random() < 0.1) { f.flick = rand(0.18, 0.3); f.timer = rand(1, 3); return; }
      pickWalk(f);
    }

    const dx = f.tx - f.x;
    const sp = f.mode === 'graze' ? 0 : f.speed;
    const vx = Math.sign(dx) * Math.min(Math.abs(dx) * 2, sp);
    f.x += vx * dt;
    if (sp > 0 && Math.abs(dx) > 2) f.dir = dx > 0 ? 1 : -1;
    f.z = approach(f.z, f.tz, 0.12 * dt);
    f.h = approach(f.h, f.th, 10 * dt);

    if (f.mode === 'swim' && Math.abs(dx) < 2) f.th = 0;
    if ((f.mode === 'walk' || f.mode === 'swim') && Math.abs(dx) < 1 && f.h < 0.5) { f.mode = 'graze'; f.timer = rand(1.5, 5); }

    const busy = f.mode === 'graze' || f.mode === 'food';
    f.amp += ((f.h > 2 ? 0.5 : 0) - f.amp) * Math.min(1, dt * 4);
    // legs cycle faster when walking or swimming, a slow fidget when grazing
    f.phase += dt * (Math.abs(vx) > 0.5 ? 8 + Math.abs(vx) * 0.8 : f.h > 2 ? 14 : busy ? 5 : 2);
  }

  function update(dt) {
    for (const p of food) {
      if (!p.landed) {
        p.y += 9 * dt; p.x += Math.sin(p.y * 0.3) * 4 * dt;
        if (p.y >= p.rest) { p.y = p.rest; p.landed = true; }
      }
    }

    updateSchool(dt);
    updateLolly(dt);
    for (const f of fish) {
      if (f.species === 'barb') { updateBarb(f, dt); continue; }
      if (f.species === 'shrimp') { updateShrimp(f, dt); continue; }
      const baseY = floorY(f.z) - SH + 2;
      if (f.leaving) { f.mode = 'leave'; f.tx = f.exitX; f.th = 0; f.speed = 24; }
      const mouthX = f.x + (f.dir > 0 ? SW - 2 : 1);

      // food takes priority over everything but an air gulp
      if (food.length && f.mode !== 'gulp-up' && !f.leaving) {
        let best = null, bd = 1e9;
        for (const p of food) {
          const dd = Math.abs(p.x - mouthX) + Math.abs(p.z - f.z) * 60;
          if (dd < bd) { bd = dd; best = p; }
        }
        f.mode = 'food'; f.target = best;
        const want = best.x > f.x + SW / 2 ? 1 : -1;
        f.tx = want > 0 ? best.x - (SW - 2) : best.x - 1;
        f.tz = best.z; f.th = 0; f.speed = 20;
        if (best.landed && Math.abs(best.x - mouthX) < 2.5 && Math.abs(best.z - f.z) < 0.06) {
          food.splice(food.indexOf(best), 1);
          f.mode = 'rest'; f.timer = rand(0.6, 1.5);
        }
      } else if (f.mode === 'food') {
        f.mode = 'rest'; f.timer = rand(1, 3);
      }

      f.timer -= dt;
      if (f.mode === 'rest' && f.timer <= 0) {
        if (Math.random() < 0.12) { f.mode = 'gulp-up'; f.th = baseY - 4; f.tx = f.x + f.dir * 10; f.speed = 26; }
        else pickWander(f);
      }

      // move
      const dx = f.tx - f.x;
      const sp = f.mode === 'rest' ? 0 : f.speed;
      const vx = Math.sign(dx) * Math.min(Math.abs(dx) * 2, sp);
      f.x += vx * dt;
      if (sp > 0 && Math.abs(dx) > 2) f.dir = dx > 0 ? 1 : -1;
      f.z += Math.sign(f.tz - f.z) * Math.min(Math.abs(f.tz - f.z), 0.18 * dt);
      const hRate = f.mode === 'gulp-up' ? 45 : f.mode === 'gulp-down' ? 30 : 12;
      f.h += Math.sign(f.th - f.h) * Math.min(Math.abs(f.th - f.h), hRate * dt);

      if (f.mode === 'gulp-up' && Math.abs(f.th - f.h) < 1) {
        f.mode = 'gulp-down'; f.th = 0; f.bubbleCd = 0.4;
        spawnBubble(f.x + (f.dir > 0 ? SW - 3 : 2), floorY(f.z) - SH + 2 - f.h + 12, f.z);
      }
      if (f.mode === 'gulp-down') {
        f.bubbleCd -= dt;
        if (f.bubbleCd <= 0 && f.h > 10) { f.bubbleCd = rand(0.5, 1.1); spawnBubble(f.x + (f.dir > 0 ? 30 : 15), floorY(f.z) - SH + 2 - f.h + 10, f.z); }
        if (f.h < 0.5) { f.mode = 'rest'; f.timer = rand(1, 3); }
      }
      if (f.mode === 'wander' && Math.abs(dx) < 1 && Math.abs(f.th - f.h) < 1) { f.mode = 'rest'; f.timer = rand(1, 5); }

      const moving = Math.abs(vx) > 0.5 || f.mode.startsWith('gulp');
      f.amp += ((moving ? 0.5 + Math.min(Math.abs(vx), 26) / 22 : 0.18) - f.amp) * Math.min(1, dt * 3);
      f.phase += dt * (moving ? 5 + Math.abs(vx) * 0.45 : 2.2);
      // sifting bob while resting on the sand
      f.bob = f.mode === 'rest' && f.h < 1 ? (Math.sin(f.phase * 0.9) > 0.3 ? 1 : 0) : 0;
    }
    fish = fish.filter(f => !f.leaving || (f.x > -SPECIES[f.species].w - 1 && f.x < vw + 1));

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y -= b.vy * dt; b.ph += dt * 4;
      b.x += Math.sin(b.ph) * 3 * dt;
      if (b.y < 3) bubbles.splice(i, 1);
    }
    // a slow trickle of bubbles from the substrate
    if (Math.random() < dt * 0.25) spawnBubble(rand(0, vw), groundAt(0) + rand(0, 6), rand(0.3, 1));
  }

  let last = performance.now(), start = last;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    const t = (now - start) / 1000 * (reduceMotion ? 0.3 : 1);

    uData.fill(0);
    uData.set([t, scale, vw, vh], 0);
    const sorted = fish.slice(0, MAX_FISH).sort((a, b) => b.z - a.z);
    uData.set([sorted.length, bubbles.length, food.length, top], 4);
    sorted.forEach((f, i) => {
      const barb = f.species === 'barb', shrimp = f.species === 'shrimp';
      const y = barb ? Math.round(f.y)
        : shrimp ? Math.round(floorY(f.z) - RH + 3 - f.h)
        : Math.round(floorY(f.z) - SH + 2 - f.h + (f.bob || 0));
      const code = barb ? (f.female ? 2 : 1) : shrimp ? 3 + f.variant : 0;
      uData.set([Math.round(f.x), y, f.dir, f.z], 8 + i * 8);
      uData.set([f.phase, f.amp, Math.round(floorY(f.z)), code], 12 + i * 8);
      uData[U_ANG * 4 + i] = f.ang || 0;
    });
    if (lolly) {
      uData.set([lolly.bx, lolly.by, lolly.r, lolly.z], U_LOLLY * 4);
      uData.set([lolly.baseX, lolly.baseY, 1, 1 - lolly.r / LOLLY_R], U_LOLLY * 4 + 4);
    }
    bubbles.forEach((b, i) => uData.set([b.x, b.y, b.r, b.z], U_BUB * 4 + i * 4));
    food.forEach((p, i) => uData.set([p.x, p.y, p.z, 0], U_FOOD * 4 + i * 4));
    device.queue.writeBuffer(uBuf, 0, uData);

    const enc = device.createCommandEncoder();
    const pass = enc.beginRenderPass({
      colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bind);
    pass.draw(3);
    pass.end();
    device.queue.submit([enc.finish()]);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
main().catch(e => { console.error(e); fail('Setup failed: ' + e.message); });
</script>
</body>
</html>
