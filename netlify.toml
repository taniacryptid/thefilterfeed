[build]
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist/client"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# The interactive aquarium is a fully self-contained static page
# served from public/game/ so it stays a plain static file.

[[headers]]
  for = "/game/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
